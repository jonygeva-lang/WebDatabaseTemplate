<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="signUp.css" />
    <title>Sign up to free cell Page</title>
</head>

<body>
<div id="signupContainer">
    <h1>Sign Up</h1>

    <p id="loginText">
        Already have an account?
        <a href="http://192.168.1.105:5000/website/pages/signIn.html">Log in</a>
    </p>

    <div class="inputGroup">
        <label>Username</label>
        <input type="text">
    </div>

    <div class="inputGroup">
        <label>Password</label>
        <input type="password">
    </div>

    <div class="inputGroup">
        <label>Confirm Password</label>
        <input type="password">
    </div>

    <button id="signupButton">Sign Up</button>
</div>
</body>

</html>
